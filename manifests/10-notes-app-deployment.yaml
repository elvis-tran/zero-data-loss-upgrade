apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: notes-app
    app.kubernetes.io/version: v1
    app.kubernetes.io/part-of: zero-data-loss-upgrade

spec:
  replicas: 2

  revisionHistoryLimit: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: notes-app

  template:
    metadata:
      labels:
        app: notes-app
        app.kubernetes.io/name: notes-app
        app.kubernetes.io/version: v1

    spec:
      nodeSelector:
        kubernetes.io/hostname: ${CLUSTER_NAME}-worker

      containers:
        - name: app
          image: ${APP_IMAGE_V1}
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: MYSQL_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: MYSQL_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: MYSQL_DATABASE

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-creds-${STUDENT_ID}
                  key: MYSQL_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-creds-${STUDENT_ID}
                  key: MYSQL_PASSWORD

            - name: STUDENT_ID
              value: ${STUDENT_ID}

            - name: APP_VERSION
              value: v1

            - name: EXPECTED_SCHEMA_VERSION
              value: "1"

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
