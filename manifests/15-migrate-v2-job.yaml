apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-v2
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: notes-app
    app.kubernetes.io/component: migration
    app.kubernetes.io/version: v2
    app.kubernetes.io/part-of: zero-data-loss-upgrade

spec:
  backoffLimit: 0

  template:
    metadata:
      labels:
        app: migrate-v2
        app.kubernetes.io/component: migration

    spec:
      restartPolicy: Never

      nodeSelector:
        kubernetes.io/hostname: ${CLUSTER_NAME}-worker

      containers:
        - name: migrate-v2
          image: mysql:8.0
          imagePullPolicy: IfNotPresent

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-creds-${STUDENT_ID}
                  key: MYSQL_ROOT_PASSWORD

          command:
            - sh
            - -c
            - |
              set -eu

              echo "Waiting for MySQL..."

              until mysqladmin ping \
                -h mysql \
                -uroot \
                -p"$MYSQL_ROOT_PASSWORD" \
                --silent
              do
                sleep 3
              done

              CURRENT_VERSION="$(
                mysql \
                  -h mysql \
                  -uroot \
                  -p"$MYSQL_ROOT_PASSWORD" \
                  -Nse "
                    SELECT version
                    FROM notesdb.schema_version
                    LIMIT 1;
                  "
              )"

              echo "Current schema version: $CURRENT_VERSION"
              echo "Target schema version: 2"

              if [ "$CURRENT_VERSION" -ge 2 ]; then
                echo "Migration v2 is already applied. No changes required."
                exit 0
              fi

              if [ "$CURRENT_VERSION" != "1" ]; then
                echo "Unexpected schema version: $CURRENT_VERSION"
                echo "Migration v2 requires schema version 1."
                exit 1
              fi

              echo "WARNING: applying deliberately destructive migration."
              echo "Only rows with id <= 10 will be copied."
              echo "The body column will then be dropped."

              mysql \
                -h mysql \
                -uroot \
                -p"$MYSQL_ROOT_PASSWORD" \
                < /migrations/002_v2.sql

              NEW_VERSION="$(
                mysql \
                  -h mysql \
                  -uroot \
                  -p"$MYSQL_ROOT_PASSWORD" \
                  -Nse "
                    SELECT version
                    FROM notesdb.schema_version
                    LIMIT 1;
                  "
              )"

              if [ "$NEW_VERSION" != "2" ]; then
                echo "Migration verification failed."
                echo "Expected schema version 2, found $NEW_VERSION."
                exit 1
              fi

              echo "Migration v2 completed with schema version 2."
              echo "WARNING: schema success does not prove data integrity."

          volumeMounts:
            - name: migration-sql
              mountPath: /migrations
              readOnly: true

      volumes:
        - name: migration-sql
          configMap:
            name: migration-v2-sql
